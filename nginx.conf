server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # AI 매매기록의 화면 캡처 업로드용.
    # nginx 기본값은 1MB 라, 4MB 까지 받도록 맞춰놓은 프론트/백엔드와 어긋나 있었다.
    # 휴대폰 스크린샷은 1~3MB 가 보통이어서 요청이 백엔드에 닿기도 전에 413 으로 끊겼다.
    # 서비스단 상한은 4MB(TradeCaptureServiceImpl), multipart 상한은 6MB 이므로 여유를 둔다.
    client_max_body_size 8m;

    # Docker 내장 DNS(127.0.0.11)로 upstream을 런타임마다 재해석.
    # 이렇게 하지 않으면 api-gateway 컨테이너 재생성 시 IP가 바뀌어도
    # nginx가 기동 시 캐시한 옛 IP를 계속 사용해 502가 발생한다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/(portal|survey|advisor|market)/ {
        set $upstream_gateway api-gateway;
        proxy_pass http://$upstream_gateway:9000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;

        # 이미지 추론은 로컬 GPU에서 수 분까지 간다 (ai 모듈 상한 300초, portal 대기 330초).
        # nginx 기본값 60초로는 추론이 성공해도 브라우저가 먼저 504를 받는다.
        proxy_connect_timeout 10s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;
    }

    location /api/ {
        set $upstream_gateway api-gateway;
        proxy_pass http://$upstream_gateway:9000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;

        proxy_connect_timeout 10s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
